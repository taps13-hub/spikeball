name: Release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: spikeball_ci
          POSTGRES_USER: spikeball_ci
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U spikeball_ci -d spikeball_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://spikeball_ci:ci-only-postgres-password@127.0.0.1:5432/spikeball_ci
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-only-secret-not-for-production-0123456789abcdefghijklmnopqrstuvwxyz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Check fresh migrations and migration drift
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Run regression tests
        run: python manage.py test
      - name: Build production image
        run: docker build --tag spikeball:ci .
      - name: Smoke-test production image without email
        run: bash scripts/smoke-container.sh spikeball:ci
