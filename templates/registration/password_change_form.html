{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
  <div class="form-page">
    <p class="eyebrow">Your account</p>
    <h1>Change password.</h1>
    <p class="lede">Enter your current password, then choose a new one.</p>
    <form method="post" class="panel form-panel">
      {% csrf_token %}
      {% include "leaderboard/_form_fields.html" %}
      <div class="form-actions"><button class="button" type="submit">Change password</button><a href="{% url 'leaderboard' %}">Cancel</a></div>
    </form>
  </div>
{% endblock %}
